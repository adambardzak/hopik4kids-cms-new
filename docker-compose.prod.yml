# Production stack for the Hopík4Kids CMS backend (VPS deployment).
# Postgres is internal (not exposed on the host). Backend is exposed on 127.0.0.1:18095,
# fronted by the host nginx at api.hopik4kids.cz with TLS.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hopik-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hopik_cms_pgdata:/var/lib/postgresql/data
    networks:
      - hopik-cms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hopik-cms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PERSONAL_ID_KEY: ${PERSONAL_ID_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      REGISTRATION_API_KEY: ${REGISTRATION_API_KEY}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Owner}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      MEDIA_DIR: /data/media
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - hopik_cms_media:/data/media
    ports:
      - "127.0.0.1:18095:8080"
    networks:
      - hopik-cms

volumes:
  hopik_cms_pgdata:
  hopik_cms_media:

networks:
  hopik-cms:
