# Production profile (activate with SPRING_PROFILES_ACTIVE=prod).
# Secrets have NO defaults here — the app fails fast at startup if they are not provided via env.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

app:
  personal-id-encryption-key: ${PERSONAL_ID_KEY}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Owner}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD}
  admin-base-url: ${ADMIN_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    from: ${EMAIL_FROM}
  media:
    storage-dir: ${MEDIA_DIR:/data/media}
    public-base-url: ${MEDIA_BASE_URL}
  registration:
    api-key: ${REGISTRATION_API_KEY}
