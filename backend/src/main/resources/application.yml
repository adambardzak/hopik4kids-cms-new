spring:
  application:
    name: hopik4kids-cms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hopik4kids}
    username: ${DB_USER:hopik}
    password: ${DB_PASSWORD:hopik}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

app:
  # AES key (Base64, 32 bytes) for encrypting personalId at-rest. Override in prod via env.
  personal-id-encryption-key: ${PERSONAL_ID_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  jwt:
    # Base64-encoded HMAC-SHA secret (>= 32 bytes). Override in prod via env.
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWZnaGlq}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  # First owner seeded at startup if no owner exists (prd §7.2). Change in prod.
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:owner@hopik4kids.cz}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Owner}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:changeme123}
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:3000}
  cors:
    # Comma-separated allowed origins for the public API (website + admin). Override in prod.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3005,http://localhost:3006}
  email:
    from: ${EMAIL_FROM:no-reply@hopik4kids.cz}
  invitation:
    ttl-hours: ${INVITATION_TTL_HOURS:72}
  password-reset:
    ttl-hours: ${PASSWORD_RESET_TTL_HOURS:2}
  media:
    storage-dir: ${MEDIA_DIR:./media-uploads}
    public-base-url: ${MEDIA_BASE_URL:http://localhost:8080/media}
  rate-limit:
    registration:
      capacity: ${RATE_LIMIT_REGISTRATION_CAPACITY:5}
      refill-minutes: ${RATE_LIMIT_REGISTRATION_REFILL_MINUTES:1}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # SMTP availability shouldn't fail the app's health probe.
    mail:
      enabled: false
